<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus & Mental Health Hub</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        h1 {
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* 1. Animasi Pernapasan */
        .breathing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 130px;
        }

        .breathing-circle {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border-radius: 50%;
            animation: breathe 8s infinite ease-in-out;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        .breathing-text {
            margin-top: 10px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* 2. Pomodoro Timer */
        .timer-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 15px 0;
            letter-spacing: 2px;
            animation: pulse-glow 2s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { text-shadow: 0 0 10px rgba(139, 92, 246, 0.2); }
            100% { text-shadow: 0 0 25px rgba(139, 92, 246, 0.7); }
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.95);
        }

        button.secondary {
            background-color: #334155;
        }

        button.secondary:hover {
            background-color: #475569;
        }

        /* 3. Mood Tracker */
        .mood-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
        }

        .mood-btn {
            background: #0f172a;
            font-size: 1.8rem;
            padding: 10px;
            border-radius: 50%;
            border: 2px solid #334155;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .mood-btn:hover {
            transform: scale(1.2);
            border-color: var(--primary);
        }

        .mood-status {
            color: var(--accent);
            font-weight: 500;
            margin-top: 10px;
        }

        /* 4. Fitur Kamera / Sensor Foto */
        .camera-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        video, img {
            width: 100%;
            max-width: 260px;
            border-radius: 8px;
            background: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Kartu 1: Relaksasi & Pernapasan -->
        <div class="card">
            <h1>🧘‍♀️ Relaksasi & Pernapasan</h1>
            <div class="breathing-container">
                <div class="breathing-circle"></div>
            </div>
            <p class="breathing-text" id="breathInstruction">Tarik napas dalam... Hembuskan perlahan</p>
        </div>

        <!-- Kartu 2: Pomodoro Fokus -->
        <div class="card">
            <h1>⏱️ Pomodoro Fokus</h1>
            <div class="timer-display" id="timer">25:00</div>
            <div class="btn-group">
                <button id="startBtn" onclick="toggleTimer()">Mulai</button>
                <button class="secondary" onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <!-- Kartu 3: Pelacak Suasana Hati -->
        <div class="card">
            <h1>💬 Bagaimana Perasaanmu Hari Ini?</h1>
            <div class="mood-options">
                <button class="mood-btn" onclick="setMood('😄 Sangat Senang')">😄</button>
                <button class="mood-btn" onclick="setMood('🙂 Produktif')">🙂</button>
                <button class="mood-btn" onclick="setMood('😌 Tenang')">😌</button>
                <button class="mood-btn" onclick="setMood('🥱 Lelah')">🥱</button>
            </div>
            <p class="mood-status" id="moodOutput">Belum memilih suasana hati
